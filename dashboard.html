<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Dashboard — Saravana Kumar M</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4B0CQMVEMD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4B0CQMVEMD', { page_title: 'Admin Dashboard', page_path: '/dashboard' });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary:       #e9692c;
      --primary-dark:  #cc5117;
      --primary-light: rgba(233,105,44,0.10);
      --bg:            #f4f6f9;
      --surface:       #ffffff;
      --border:        #e8eaed;
      --text:          #1a1a1a;
      --text-muted:    #6b7280;
      --danger:        #ef4444;
      --danger-light:  rgba(239,68,68,0.08);
      --success:       #10b981;
      --radius:        10px;
      --shadow-sm:     0 1px 4px rgba(0,0,0,0.07);
      --shadow-md:     0 4px 16px rgba(0,0,0,0.10);
      --transition:    all 0.22s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Top Header ───────────────────────────────────────────── */
    .db-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .db-header-left {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.42rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: 7px;
      text-decoration: none;
      background: transparent;
      transition: var(--transition);
      font-family: 'Poppins', sans-serif;
    }
    .back-btn:hover { background: var(--primary); color: #fff; }

    .db-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }
    .db-title i { color: var(--primary); font-size: 1.2rem; }

    .db-header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .db-user {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .db-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Main Layout ──────────────────────────────────────────── */
    .db-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    /* ── Stats Row ────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.8rem;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      width: 42px; height: 42px;
      border-radius: 9px;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stat-icon i { color: var(--primary); font-size: 1.1rem; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-bottom: 0.15rem; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1; }

    /* ── Toolbar ──────────────────────────────────────────────── */
    .toolbar {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-sm);
    }
    .toolbar-left { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }

    /* Search */
    .search-wrap {
      position: relative;
    }
    .search-wrap i {
      position: absolute;
      left: 0.75rem; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }
    .search-input {
      padding: 0.5rem 1rem 0.5rem 2.2rem;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.85rem;
      font-family: 'Poppins', sans-serif;
      width: 260px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg);
      color: var(--text);
    }
    .search-input:focus { border-color: var(--primary); background: #fff; }
    .search-input::placeholder { color: #aaa; }

    /* Toolbar buttons */
    .tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.48rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Poppins', sans-serif;
    }
    .tb-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tb-btn.primary { border-color: var(--primary); color: var(--primary); }
    .tb-btn.primary:hover { background: var(--primary); color: #fff; }
    .tb-btn i { font-size: 0.8rem; }

    .msg-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Table Card ───────────────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .table-container { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    thead tr {
      background: var(--primary);
    }
    th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    th i { margin-right: 0.4rem; opacity: 0.85; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fdf5f0; }

    td {
      padding: 0.85rem 1rem;
      vertical-align: middle;
      color: var(--text);
    }

    /* Name cell with avatar */
    .name-cell {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .row-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .name-text { font-weight: 600; font-size: 0.875rem; }

    /* Email cell */
    .email-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .email-text { color: var(--text-muted); font-size: 0.82rem; }
    .mailto-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 6px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .mailto-btn:hover { background: var(--primary); color: #fff; }
    .mailto-btn i { font-size: 0.72rem; }

    /* Message cell */
    .msg-text {
      max-width: 320px;
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
      word-break: break-word;
    }

    /* Date / time */
    .date-text { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }
    .time-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Delete button */
    .delete-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 7px;
      border: none;
      background: var(--danger-light);
      color: var(--danger);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.8rem;
    }
    .delete-btn:hover { background: var(--danger); color: #fff; }

    /* ── Empty State ──────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }
    .empty-state i {
      font-size: 3rem;
      color: #ddd;
      margin-bottom: 1rem;
      display: block;
    }
    .empty-state p { color: var(--text-muted); font-size: 0.9rem; }

    /* ── Loading Spinner ──────────────────────────────────────── */
    .loading-state {
      text-align: center;
      padding: 3.5rem 2rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(233,105,44,0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { color: var(--text-muted); font-size: 0.85rem; }

    /* ── Toast ────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.8rem; right: 1.8rem;
      background: #1a1a1a;
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 9999;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success i { color: var(--success); }
    #toast.error   i { color: var(--danger); }
    #toast.info    i { color: var(--primary); }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .search-input { width: 180px; }
      .db-user span { display: none; }
      .db-title span { display: none; }
    }
    @media (max-width: 520px) {
      .stats-row { grid-template-columns: 1fr; }
      .db-main { padding: 1rem; }
      .toolbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="db-header">
    <div class="db-header-left">
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>
      <div class="db-title">
        <i class="fas fa-inbox"></i>
        <span>Contact Dashboard</span>
      </div>
    </div>
    <div class="db-header-right">
      <div class="db-user">
        <div class="db-avatar">SK</div>
        <span>Saravana Kumar M</span>
      </div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="db-main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-envelope-open-text"></i></div>
        <div>
          <div class="stat-label">Total Messages</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-calendar-day"></i></div>
        <div>
          <div class="stat-label">Today</div>
          <div class="stat-value" id="statToday">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-filter"></i></div>
        <div>
          <div class="stat-label">Showing</div>
          <div class="stat-value" id="statShowing">—</div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchBox" class="search-input" placeholder="Search name, email or message…" oninput="filterContacts()">
        </div>
        <button class="tb-btn primary" onclick="refreshData()" id="refreshBtn">
          <i class="fas fa-rotate-right"></i> Refresh
        </button>
        <button class="tb-btn" onclick="exportToCSV()" id="exportBtn" disabled>
          <i class="fas fa-file-csv"></i> Export CSV
        </button>
      </div>
      <span class="msg-count" id="msgCount"></span>
    </div>

    <!-- Table Card -->
    <div class="table-card">
      <div class="table-container" id="tableContainer">

        <!-- Loading state (shown on first load) -->
        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p>Loading messages…</p>
        </div>

        <table id="dataTable" style="display:none;">
          <thead>
            <tr>
              <th><i class="fas fa-user"></i>Name</th>
              <th><i class="fas fa-envelope"></i>Email</th>
              <th><i class="fas fa-comment-dots"></i>Message</th>
              <th><i class="fas fa-calendar"></i>Submitted</th>
              <th><i class="fas fa-clock"></i>Time</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="contactsTableBody"></tbody>
        </table>

        <!-- Empty state -->
        <div class="empty-state" id="emptyState" style="display:none;">
          <i class="fas fa-inbox"></i>
          <p>No messages found.</p>
        </div>

      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

  <script type="module">
    import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, orderBy, query }
      from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyA1cDs79vmLw4RPs12c6ow3mKkZOYUEsTg",
      authDomain:        "portfolio-webapp-1aac4.firebaseapp.com",
      projectId:         "portfolio-webapp-1aac4",
      storageBucket:     "portfolio-webapp-1aac4.appspot.com",
      messagingSenderId: "78285808940",
      appId:             "1:78285808940:web:f012c69d9e2e602d8a7889"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    let contactsData = [];

    /* ── Helpers ── */
    function format12Hour(date) {
      const h = date.getHours(), m = String(date.getMinutes()).padStart(2, "0");
      return `${h % 12 || 12}:${m} ${h >= 12 ? "PM" : "AM"}`;
    }

    function initials(name) {
      if (!name) return "?";
      const parts = name.trim().split(" ");
      return parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : name.slice(0, 2).toUpperCase();
    }

    function isToday(dateStr) {
      const d = new Date(dateStr), t = new Date();
      return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
    }

    function showToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      const icon  = toast.querySelector("i");
      document.getElementById("toastMsg").textContent = msg;
      toast.className = `show ${type}`;
      icon.className = type === "success" ? "fas fa-check-circle"
                     : type === "error"   ? "fas fa-circle-xmark"
                     :                      "fas fa-circle-info";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.className = ""; }, 3200);
    }

    function updateStats(data) {
      document.getElementById("statTotal").textContent   = contactsData.length;
      document.getElementById("statToday").textContent   = contactsData.filter(c => isToday(c.submitted)).length;
      document.getElementById("statShowing").textContent = data.length;
      document.getElementById("msgCount").textContent    = `${data.length} result${data.length !== 1 ? "s" : ""}`;
    }

    /* ── Load ── */
    async function loadContacts() {
      document.getElementById("loadingState").style.display = "block";
      document.getElementById("dataTable").style.display    = "none";
      document.getElementById("emptyState").style.display   = "none";

      try {
        const q        = query(collection(db, "contacts"), orderBy("timestamp", "desc"));
        const snapshot = await getDocs(q);
        contactsData   = [];
        snapshot.forEach(d => contactsData.push({ ...d.data(), id: d.id }));

        document.getElementById("exportBtn").disabled = contactsData.length === 0;
        displayContacts(contactsData);
        if (contactsData.length > 0) showToast(`${contactsData.length} messages loaded`, "info");
      } catch (err) {
        console.error(err);
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("emptyState").style.display   = "block";
        showToast("Failed to load messages", "error");
      }
    }

    /* ── Display ── */
    function displayContacts(data) {
      document.getElementById("loadingState").style.display = "none";

      const tbody = document.getElementById("contactsTableBody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        document.getElementById("dataTable").style.display  = "none";
        document.getElementById("emptyState").style.display = "block";
        updateStats(data);
        return;
      }

      document.getElementById("dataTable").style.display  = "table";
      document.getElementById("emptyState").style.display = "none";

      data.forEach(c => {
        const date = c.timestamp?.toDate?.() || new Date(c.submitted);
        const row  = document.createElement("tr");
        row.innerHTML = `
          <td>
            <div class="name-cell">
              <div class="row-avatar">${initials(c.name)}</div>
              <span class="name-text">${c.name || "N/A"}</span>
            </div>
          </td>
          <td>
            <div class="email-cell">
              <span class="email-text">${c.email || "N/A"}</span>
              ${c.email ? `<a class="mailto-btn" href="mailto:${c.email}" title="Reply via email"><i class="fas fa-reply"></i></a>` : ""}
            </div>
          </td>
          <td><div class="msg-text" title="${(c.message || "").replace(/"/g, "&quot;")}">${c.message || "—"}</div></td>
          <td><span class="date-text">${new Date(c.submitted).toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" })}</span></td>
          <td><span class="time-badge">${format12Hour(date)}</span></td>
          <td>
            <button class="delete-btn" title="Delete message" onclick="deleteContact('${c.id}', this)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });

      updateStats(data);
    }

    /* ── Delete ── */
    window.deleteContact = async function(id, btn) {
      if (!confirm("Delete this message? This cannot be undone.")) return;
      try {
        await deleteDoc(doc(db, "contacts", id));
        btn.closest("tr").remove();
        contactsData = contactsData.filter(c => c.id !== id);
        updateStats(contactsData);
        showToast("Message deleted", "success");
        if (typeof gtag !== 'undefined') gtag('event', 'dashboard_delete_message', {
          event_category: 'admin_dashboard', event_label: 'Message Deleted'
        });
      } catch (err) {
        console.error(err);
        showToast("Could not delete message", "error");
      }
    };

    /* ── Filter ── */
    window.filterContacts = function() {
      const term     = document.getElementById("searchBox").value.toLowerCase();
      const filtered = contactsData.filter(c =>
        (c.name    || "").toLowerCase().includes(term) ||
        (c.email   || "").toLowerCase().includes(term) ||
        (c.message || "").toLowerCase().includes(term)
      );
      displayContacts(filtered);
    };

    /* ── Refresh ── */
    window.refreshData = () => {
      document.getElementById("searchBox").value = "";
      if (typeof gtag !== 'undefined') gtag('event', 'dashboard_refresh', {
        event_category: 'admin_dashboard', event_label: 'Refresh Messages'
      });
      loadContacts();
    };

    /* ── Export CSV ── */
    window.exportToCSV = function() {
      if (!contactsData.length) return showToast("No data to export", "error");
      if (typeof gtag !== 'undefined') gtag('event', 'dashboard_export_csv', {
        event_category: 'admin_dashboard', event_label: 'Export CSV', value: contactsData.length
      });
      let csv = "Name,Email,Message,Submitted,Time\n";
      contactsData.forEach(c => {
        const d = c.timestamp?.toDate?.() || new Date(c.submitted);
        const escape = s => `"${(s || "").replace(/"/g, '""')}"`;
        csv += `${escape(c.name)},${escape(c.email)},${escape(c.message)},"${new Date(c.submitted).toLocaleDateString()}","${format12Hour(d)}"\n`;
      });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = `contacts_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("CSV exported successfully", "success");
    };

    /* ── Auto-load on page open ── */
    loadContacts();
  </script>
</body>
</html>
